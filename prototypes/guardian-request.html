<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>멍더랜드 | 등원 요청사항 화면 시안</title>
<style>body{font-family:system-ui,'Malgun Gothic',sans-serif;background:#f5f7fa;color:#203046;margin:0}main{max-width:540px;margin:35px auto;padding:22px;background:white;border-radius:16px;box-shadow:0 5px 24px #12233a14}h1{font-size:23px}p{color:#526176;line-height:1.6}label{display:block;margin:19px 0 7px;font-weight:650}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #aebdca;border-radius:9px;font:inherit}button{padding:12px 16px;background:#1e645b;color:white;border:0;border-radius:9px;font:inherit}button:disabled{background:#aab4bb}fieldset{border:0;padding:0;margin:0}legend{font-weight:650;margin:18px 0 8px}.choice{display:inline-flex;align-items:center;margin-right:18px;gap:5px}.choice input{width:auto}.notice{background:#eef5f3;padding:12px;border-radius:9px;margin:18px 0}small{color:#526176}</style></head>
<body><main><h1>🐾 멍더랜드 등원 요청사항</h1><p>보호자 전용 화면 <strong>디자인 시안</strong>입니다. 실제 예약 조회·인증·저장은 연결되지 않았습니다.</p>
<div class="notice">등원 처리 전까지만 요청사항을 수정할 수 있습니다. 등원 이후 변경사항은 직원에게 직접 알려주세요.</div>
<form id="req">
<label for="meal">희망 식사 시간</label><input id="meal" type="time" autocomplete="off">
<fieldset><legend>사료 지참 여부</legend><label class="choice"><input type="radio" name="food" value="yes" required>지참</label><label class="choice"><input type="radio" name="food" value="no">미지참</label></fieldset>
<fieldset><legend>매너벨트 지참 여부</legend><label class="choice"><input type="radio" name="belt" value="yes" required>지참</label><label class="choice"><input type="radio" name="belt" value="no">미지참</label><label class="choice"><input type="radio" name="belt" value="na">해당 없음</label></fieldset>
<label for="condition">오늘 컨디션</label><select id="condition" required><option value="">선택해 주세요</option><option value="normal">평소와 같음</option><option value="caution">주의 필요</option></select>
<label for="notes">특이사항 (선택)</label><textarea id="notes" maxlength="500" rows="4" placeholder="직원에게 전달할 사항을 적어주세요."></textarea>
<p><small>매너벨트 필수 대상 여부는 직원이 별도로 확인합니다. 미지참 시 등원 가능 여부는 운영정책에 따릅니다.</small></p>
<button type="submit">입력 내용 확인 (저장 안 됨)</button><p id="result" role="status" aria-live="polite"></p>
</form></main><script>document.getElementById('req').addEventListener('submit',function(e){e.preventDefault();document.getElementById('result').textContent='화면 입력 검증만 완료했습니다. 서버에 저장되지 않았습니다.';});</script></body></html>
