<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>멍더랜드 · 보호자 등원 요청 미리보기</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#26332e;background:#f5f7f4}
*{box-sizing:border-box}body{margin:0;padding:24px 16px}main{max-width:520px;margin:auto}
header{margin-bottom:24px}.eyebrow{color:#4b7760;font-weight:700;font-size:13px}h1{font-size:25px;margin:7px 0}p{color:#65746b;line-height:1.6}
.card{background:white;border:1px solid #e0e9e2;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 4px 18px #1b3b2910}
label{display:block;font-size:14px;font-weight:700;margin:18px 0 8px}input,select,textarea{width:100%;padding:13px;border:1px solid #ccd8ce;border-radius:10px;font:inherit;background:white}
textarea{min-height:110px;resize:vertical}.hint{font-size:12px;color:#69786f;margin-top:7px}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#326c4d;color:white;font-size:16px;font-weight:700;margin-top:20px;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}.notice{border-left:3px solid #c28b2c;padding:12px 14px;background:#fff8e9;font-size:13px;line-height:1.6}
.status{font-size:13px;font-weight:700;color:#567363}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}
</style></head><body><main>
<header><div class="eyebrow">MUNG THE LAND · TEST PREVIEW</div><h1>등원 전 요청사항</h1><p>오늘 아이의 상태와 필요한 사항을 미리 알려주세요.</p></header>
<div class="notice"><strong>개발용 화면입니다.</strong> 로그인과 서버 인증이 연결되지 않았으므로 입력값은 전송하거나 저장하지 않습니다. 실제 고객 정보를 입력하지 마세요.</div>
<section class="card"><div class="row"><strong>등원 요청서</strong><span class="status">미제출 · 미리보기</span></div>
<form id="request">
<label for="mealTime">식사 희망시간 (선택)</label><input id="mealTime" name="mealTime" type="time">
<label for="foodBrought">사료 지참</label><select id="foodBrought" name="foodBrought" required><option value="">선택해 주세요</option><option value="yes">지참해요</option><option value="no">지참하지 않아요</option></select>
<label for="mannerBelt">매너벨트 지참</label><select id="mannerBelt" name="mannerBelt" required><option value="">선택해 주세요</option><option value="yes">지참해요</option><option value="no">지참하지 않아요</option><option value="na">해당 없음</option></select>
<label for="condition">오늘 컨디션</label><select id="condition" name="condition" required><option value="">선택해 주세요</option><option value="normal">평소와 같아요</option><option value="caution">주의가 필요해요</option></select>
<label for="notes">특이사항 (최대 500자)</label><textarea id="notes" name="notes" maxlength="500" placeholder="예: 아침 식사를 조금 남겼어요."></textarea><div class="hint">등원 전까지 수정할 수 있도록 개발할 예정입니다.</div>
<button type="button" disabled>인증 연동 후 제출 가능</button></form></section>
<p class="hint">현재 화면은 디자인 및 입력 필드 검토용이며, 운영 ERP·테스트 스프레드시트에도 쓰지 않습니다.</p>
</main></body></html>
