name: ERP isolated regression tests
on:
  push:
    paths:
      - 'src/Code.js'
      - 'src/BookingChange.js'
      - 'src/IntegrityAudit.js'
      - 'src/Passes.js'
      - 'src/PassAdjust.js'
      - 'src/Index.html'
      - 'tests/passes.integration.test.js'
      - 'tests/attendance.integration.test.js'
      - 'tests/booking-change.integration.test.js'
      - 'tests/integrity.integration.test.js'
      - 'tests/passes.ui.test.js'
      - '.github/workflows/erp-tests.yml'
  workflow_dispatch:
jobs:
  pass-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check web UI inline script syntax
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('src/Index.html','utf8');
          const scripts=[...html.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/gi)];
          if(!scripts.length)throw Error('No inline script found');
          scripts.forEach((m,i)=>new vm.Script(m[1],{filename:'Index.html inline script '+i}));
          console.log('PASS: UI JavaScript syntax');
          NODE
      - name: Test pass lifecycle in memory only
        run: node tests/passes.integration.test.js
      - name: Test attendance state transitions in memory
        run: node tests/attendance.integration.test.js
      - name: Test booking changes in memory
        run: node tests/booking-change.integration.test.js
      - name: Test cross-sheet integrity audit in memory
        run: node tests/integrity.integration.test.js
      - name: Install isolated DOM test dependency
        run: npm install --no-save --no-package-lock jsdom@26
      - name: Test pass UI interactions with mocked Apps Script
        run: node tests/passes.ui.test.js
