<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>멍더랜드 직원 등원 확인 테스트</title><style>body{font:16px system-ui;max-width:560px;margin:40px auto;padding:16px}input,button{display:block;box-sizing:border-box;width:100%;padding:12px;margin:8px 0}pre{white-space:pre-wrap;background:#eee;padding:12px}button{cursor:pointer}.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}.summary div{border:1px solid #ddd;border-radius:8px;padding:12px}.summary strong{display:block;font-size:24px}.booking-card{border:1px solid #d4ded7;border-radius:10px;padding:14px;margin:10px 0;background:#fff}.booking-card h3{margin:0 0 6px}.booking-card p{margin:6px 0}.booking-card button{margin-bottom:0}.booking-card .status{font-weight:600}.booking-card[data-review='pending']{border-left:5px solid #bb7a12}.booking-card[data-review='confirmed']{border-left:5px solid #287552}.booking-card[data-review='unknown']{border-left:5px solid #777}.attendance-state{font-weight:700;padding:8px 10px;border-radius:6px;background:#f2f4f5}.attendance-state[data-state='예약']{background:#f3f4f6;color:#454b54}.attendance-state[data-state='등원 중']{background:#e7f2ff;color:#165b98}.attendance-state[data-state='하원 완료']{background:#e4f5e9;color:#23643a}.attendance-detail{font-size:13px;color:#555;overflow-wrap:anywhere}@media(max-width:480px){body{margin:12px auto;padding:12px}.summary{gap:6px}}</style><h1>직원 등원 요청 확인 · 격리 테스트</h1><p>테스트 직원 계정만 사용하세요. 운영 ERP가 아닙니다.</p><form id="login"><input id="email" type="email" placeholder="직원 테스트 이메일" required><input id="password" type="password" placeholder="비밀번호" required><button>로그인</button></form><button id="logout">로그아웃</button><label>조회 날짜<input id="visit-date" type="date"></label><button id="today" type="button">오늘 예약</button><button id="list" type="button">선택 날짜 예약 조회</button><div id="booking-summary" class="summary" aria-live="polite"></div><div id="booking-list" role="status"></div><label>테스트 예약번호<input id="booking" value="RSV-TEST-001"></label><button id="load">요청 조회</button><pre id="result" role="status">대기 중</pre><section id="review" hidden><h2>등원 요청사항</h2><p id="review-status"></p><dl id="review-fields"></dl></section><button id="ack" disabled>현재 버전 확인 처리</button><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
const app=initializeApp({apiKey:'AIzaSyB_Mz4-w0Wi7HNyKYyyFKEDTlsT8y7pwOg',authDomain:'mungtheland-guardian-test.firebaseapp.com',projectId:'mungtheland-guardian-test',appId:'1:778415626572:web:c0c2307f1a241005bfd7e9'});
const auth=getAuth(app),$=id=>document.getElementById(id);let revision=null;
const url=()=>'/api/staff/bookings/'+encodeURIComponent($('booking').value.trim())+'/arrival-request';
const show=x=>$('result').textContent=x;
const koreaToday=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const formatKst=value=>{if(!value)return '기록 없음';const d=new Date(value);if(Number.isNaN(d.getTime()))return '시간 확인 불가';return new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(d);};
$('visit-date').value=koreaToday();
let listRequest=0;
async function loadList(){
 const seq=++listRequest,root=$('booking-list'),summary=$('booking-summary');
 root.replaceChildren();summary.replaceChildren();
 if(!auth.currentUser){root.textContent='직원 로그인이 필요합니다.';return;}
 const date=$('visit-date').value;
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){root.textContent='조회 날짜를 선택해 주세요.';return;}
 root.textContent='예약 목록 조회 중';
 try{
  const token=await auth.currentUser.getIdToken();
  const response=await fetch('/api/staff/bookings',{headers:{Authorization:'Bearer '+token},cache:'no-store'});
  if(seq!==listRequest)return;
  if(!response.ok){root.textContent=response.status===401||response.status===403?'인증 또는 권한 확인 필요. 다시 로그인해 주세요.':'예약 목록 조회 실패 HTTP '+response.status;return;}
  const data=await response.json();
  if(!Array.isArray(data.bookings))throw Error('Invalid response');
  const combinedById=new Map((Array.isArray(data.combined)?data.combined:[]).map(v=>[v.bookingId,v]));
  const matches=data.bookings.filter(v=>v.visitDate===date);
  const entries=await Promise.all(matches.map(async booking=>{
   try{
    const res=await fetch('/api/staff/bookings/'+encodeURIComponent(booking.bookingId)+'/arrival-request',{headers:{Authorization:'Bearer '+token},cache:'no-store'});
    if(!res.ok)return {booking,review:'unknown'};
    const detail=await res.json(),v=detail.request;
    return {booking,review:!v?'none':Number(v.revision)>0&&Number(v.reviewedRevision)===Number(v.revision)?'confirmed':'pending'};
   }catch(_){return {booking,review:'unknown'};}
  }));
  if(seq!==listRequest)return;
  const rank={pending:0,unknown:1,none:2,confirmed:3};
  entries.sort((a,b)=>rank[a.review]-rank[b.review]||String(a.booking.bookingId).localeCompare(String(b.booking.bookingId)));
  const pending=entries.filter(e=>e.review==='pending').length;
  for(const [label,value] of [['전체 예약',entries.length],['직원 확인 대기',pending]]){
   const cell=document.createElement('div'),heading=document.createElement('span'),number=document.createElement('strong');
   heading.textContent=label;number.textContent=String(value);cell.append(heading,number);summary.append(cell);
  }
  root.replaceChildren();
  if(!entries.length){root.textContent=date+' 예약이 없습니다.';return;}
  const statusText={pending:'직원 확인 대기',confirmed:'직원 확인 완료',none:'요청 없음',unknown:'확인 상태 조회 실패'};
  for(const {booking,review} of entries){
   const card=document.createElement('article');card.className='booking-card';card.dataset.review=review;
   const name=document.createElement('h3');name.textContent=booking.dogName||'반려견';
   const info=document.createElement('p');info.textContent=(booking.visitDate||'날짜 미등록')+' · '+booking.bookingId;
   const combined=combinedById.get(booking.bookingId);
   const combinedText=document.createElement('p');combinedText.className='attendance-state';combinedText.textContent='등하원: '+(combined?.attendanceState||'조회 중');if(combined)combinedText.dataset.state=combined.attendanceState;
   const status=document.createElement('p');status.textContent='예약 원장: '+(booking.status||'상태 미등록')+' (별도 관리)';
   const reviewText=document.createElement('p');reviewText.className='status';reviewText.textContent=statusText[review];
   const button=document.createElement('button');button.type='button';button.textContent='등원 요청사항 확인';
   button.onclick=()=>{$('booking').value=booking.bookingId;$('load').click();};
   const attendance=document.createElement('p');attendance.className='attendance-detail';attendance.textContent='등하원 시각 조회 중';
   const inButton=document.createElement('button'),outButton=document.createElement('button');
   inButton.type='button';outButton.type='button';inButton.textContent='등원 처리 (테스트)';outButton.textContent='하원 처리 (테스트)';
   const update=async()=>{
    inButton.disabled=true;outButton.disabled=true;
    const res=await fetch('/api/staff/bookings/'+encodeURIComponent(booking.bookingId)+'/attendance',{headers:{Authorization:'Bearer '+token},cache:'no-store'});
    if(seq!==listRequest)return;
    if(!res.ok){attendance.textContent='테스트 상태 조회 실패 HTTP '+res.status;inButton.disabled=true;outButton.disabled=true;return;}
    const data=await res.json(),v=data.attendance;
    combinedText.textContent='등하원: '+v.state;combinedText.dataset.state=v.state;
    attendance.textContent=(v.checkIn?'등원 '+formatKst(v.checkIn.at)+' · '+v.checkIn.staffId:'등원 기록 없음')+(v.checkOut?' / 하원 '+formatKst(v.checkOut.at)+' · '+v.checkOut.staffId:'');
    inButton.disabled=v.state!=='예약';outButton.disabled=v.state!=='등원 중';
   };
   const change=async action=>{
    inButton.disabled=true;outButton.disabled=true;
    try{
     const res=await fetch('/api/staff/bookings/'+encodeURIComponent(booking.bookingId)+'/attendance/'+action,{method:'POST',headers:{Authorization:'Bearer '+await auth.currentUser.getIdToken()}});
     if(!res.ok){attendance.textContent=res.status===409?'상태가 이미 변경됐습니다. 다시 조회해 주세요.':'상태 변경 실패 HTTP '+res.status;}
     await update();
    }catch(_){attendance.textContent='상태 변경 중 오류 발생';}
   };
   inButton.onclick=()=>change('check-in');outButton.onclick=()=>change('check-out');
   card.append(name,info,combinedText,status,reviewText,button,attendance,inButton,outButton);root.append(card);
   await update();
  }
 }catch(_){if(seq===listRequest)root.textContent='목록 조회 중 오류가 발생했습니다.';}
}
$('list').onclick=loadList;
$('today').onclick=()=>{$('visit-date').value=koreaToday();void loadList();};
$('visit-date').onchange=loadList;const render=v=>{const fields=[['예약번호',v.bookingId],['식사 희망시간',v.mealTime],['사료 지참',v.foodProvided],['매너벨트 지참',v.mannerBelt],['건강 상태',v.condition],['특이사항',v.notes],['요청 버전',v.revision],['직원 확인 버전',v.reviewedRevision],['확인 직원',v.acknowledgedBy||'없음'],['확인 시각',v.acknowledgedAt||'없음']];const root=$('review-fields');root.replaceChildren();for(const [label,value] of fields){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=String(value??'미입력');root.append(dt,dd);}$('review-status').textContent=Number(v.revision)>0&&Number(v.reviewedRevision)===Number(v.revision)?'직원 확인 완료':'직원 확인 대기';$('review').hidden=false;};
$('login').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value);show('로그인 성공. 요청을 조회하세요.')}catch(_){show('로그인 실패')}finally{$('password').value=''}};
$('logout').onclick=async()=>{++listRequest;$('booking-list').replaceChildren();$('booking-summary').replaceChildren();await signOut(auth);revision=null;$('ack').disabled=true;$('review').hidden=true;show('로그아웃됨')};
$('load').onclick=async()=>{revision=null;$('ack').disabled=true;$('review').hidden=true;try{if(!auth.currentUser){show('직원 로그인이 필요합니다.');return;}const token=await auth.currentUser.getIdToken();const r=await fetch(url(),{headers:{Authorization:'Bearer '+token},cache:'no-store'});const d=await r.json();if(!r.ok){show(r.status===401||r.status===403?'인증 또는 접근 권한 확인 필요 (HTTP '+r.status+'). 다시 로그인해 주세요.':'조회 거부 HTTP '+r.status);return;}const v=d.request;if(!v){show('요청사항 없음');return;}revision=v.revision;render(v);show('요청 조회 완료');$('ack').disabled=Number(v.reviewedRevision)===Number(v.revision)}catch(_){show('조회 실패')}};
$('ack').onclick=async()=>{if(revision===null)return;$('ack').disabled=true;try{const token=await auth.currentUser.getIdToken();const r=await fetch(url()+'/acknowledge',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({expectedRevision:revision})});show(r.ok?'확인 처리 완료. 다시 조회하세요.':r.status===409?'요청이 수정되었습니다. 다시 조회해 주세요.':r.status===401||r.status===403?'인증 또는 접근 권한 확인 필요 (HTTP '+r.status+'). 다시 로그인해 주세요.':'확인 실패 HTTP '+r.status+' — 다시 조회하세요.')}catch(_){show('서버 연결 실패')}};
</script></html>
