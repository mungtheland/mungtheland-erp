<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>멍더랜드 직원 등원 확인 테스트</title><style>body{font:16px system-ui;max-width:560px;margin:40px auto;padding:16px}input,button{display:block;box-sizing:border-box;width:100%;padding:12px;margin:8px 0}pre{white-space:pre-wrap;background:#eee;padding:12px}button{cursor:pointer}</style><h1>직원 등원 요청 확인 · 격리 테스트</h1><p>테스트 직원 계정만 사용하세요. 운영 ERP가 아닙니다.</p><form id="login"><input id="email" type="email" placeholder="직원 테스트 이메일" required><input id="password" type="password" placeholder="비밀번호" required><button>로그인</button></form><button id="logout">로그아웃</button><label>테스트 예약번호<input id="booking" value="RSV-TEST-001"></label><button id="load">요청 조회</button><pre id="result">대기 중</pre><button id="ack" disabled>현재 버전 확인 처리</button><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
const app=initializeApp({apiKey:'AIzaSyB_Mz4-w0Wi7HNyKYyyFKEDTlsT8y7pwOg',authDomain:'mungtheland-guardian-test.firebaseapp.com',projectId:'mungtheland-guardian-test',appId:'1:778415626572:web:c0c2307f1a241005bfd7e9'});
const auth=getAuth(app),$=id=>document.getElementById(id);let revision=null;
const url=()=>'/api/staff/bookings/'+encodeURIComponent($('booking').value.trim())+'/arrival-request';
const show=x=>$('result').textContent=x;
$('login').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value);show('로그인 성공. 요청을 조회하세요.')}catch(_){show('로그인 실패')}finally{$('password').value=''}};
$('logout').onclick=async()=>{await signOut(auth);revision=null;$('ack').disabled=true;show('로그아웃됨')};
$('load').onclick=async()=>{revision=null;$('ack').disabled=true;try{const token=await auth.currentUser.getIdToken();const r=await fetch(url(),{headers:{Authorization:'Bearer '+token},cache:'no-store'});const d=await r.json();if(!r.ok){show('조회 거부 HTTP '+r.status);return;}const v=d.request;if(!v){show('요청사항 없음');return;}revision=v.revision;show(JSON.stringify(v,null,2));$('ack').disabled=Number(v.reviewedRevision)===Number(v.revision)}catch(_){show('조회 실패')}};
$('ack').onclick=async()=>{if(revision===null)return;$('ack').disabled=true;try{const token=await auth.currentUser.getIdToken();const r=await fetch(url()+'/acknowledge',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({expectedRevision:revision})});show(r.ok?'확인 처리 완료. 다시 조회하세요.':'확인 실패 HTTP '+r.status+' — 다시 조회하세요.')}catch(_){show('서버 연결 실패')}};
</script></html>
